<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Személyes adatok</title>
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#d5dce6;
  --accent:#1f5fbf; --accent-ink:#ffffff; --bar:#e6ebf2; --off:#c3ccd8;
  --bg1:#dbe7f8; --bg2:#f5f8fc; --w1:#b7cff0; --w2:#98b9e6; --w3:#7aa3dc; --shadow:rgba(25,50,100,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171e; --panel:#1b222c; --ink:#e7ecf3; --muted:#9aa8ba; --line:#2d3746;
    --accent:#6ea3f2; --accent-ink:#0f1720; --bar:#232c38; --off:#3a4556;
    --bg1:#0c1220; --bg2:#172234; --w1:#1b2a44; --w2:#213456; --w3:#2a4270; --shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#12171e; --panel:#1b222c; --ink:#e7ecf3; --muted:#9aa8ba; --line:#2d3746;
  --accent:#6ea3f2; --accent-ink:#0f1720; --bar:#232c38; --off:#3a4556;
  --bg1:#0c1220; --bg2:#172234; --w1:#1b2a44; --w2:#213456; --w3:#2a4270; --shadow:rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.bg .a{stop-color:var(--bg1)} .bg .b{stop-color:var(--bg2)}
.bg .w1{fill:var(--w1)} .bg .w2{fill:var(--w2)} .bg .w3{fill:var(--w3)}
.photo{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;pointer-events:none}
.photo[hidden]{display:none}
.has-photo h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.65)}
.wrap{position:relative;max-width:1100px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:2rem;margin:0 0 24px;letter-spacing:-.01em}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--bar);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 20px}
.banner[hidden]{display:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
section{box-shadow:0 8px 28px var(--shadow);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
h2{font-size:1.15rem;margin:0 0 16px}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 4px}
.field{margin-bottom:14px}
input{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:6px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;padding:10px 22px;border:0;border-radius:6px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{background:var(--off);color:var(--muted);cursor:not-allowed}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.status{margin:12px 0 0;min-height:1.5em;color:var(--muted);font-size:.9rem}
.win{margin-top:16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bar{background:var(--bar);padding:8px 12px;font-size:.85rem;font-weight:600;display:flex;justify-content:space-between}
.body{padding:0;max-height:420px;overflow:auto}
.empty{padding:20px 14px;color:var(--muted);margin:0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--bg);position:sticky;top:0}
tr:last-child td{border-bottom:0}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:22px 26px;max-width:min(90vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;gap:8px}
dialog p{margin:0 0 16px;font-weight:600}
</style>
</head>
<body>
<svg class="bg" aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient></defs>
  <rect width="1440" height="900" fill="url(#g)"/>
  <circle class="w1" cx="1250" cy="110" r="270" opacity=".28"/>
  <circle class="w2" cx="150" cy="70" r="190" opacity=".22"/>
  <path class="w1" opacity=".55" d="M0 640C240 560 480 720 720 660S1200 480 1440 560V900H0Z"/>
  <path class="w2" opacity=".6" d="M0 720C300 640 520 800 820 740S1290 620 1440 680V900H0Z"/>
  <path class="w3" opacity=".7" d="M0 800C260 760 560 860 860 810S1300 740 1440 780V900H0Z"/>
</svg>
<div class="photo" id="photo" hidden></div>

<dialog id="dup" aria-labelledby="dup-t">
  <p id="dup-t">Ez a személy már a listában van</p>
  <form method="dialog"><button autofocus>OK</button></form>
</dialog>
<dialog id="del" aria-labelledby="del-t">
  <p id="del-t">Biztosan törlöd a teljes (mindenki által látott) listát?</p>
  <form method="dialog"><button value="cancel" class="sec" autofocus>Mégse</button><button value="ok">Törlés</button></form>
</dialog>

<div class="wrap">
  <h1>Személyes adatok</h1>
  <div class="banner" id="banner" hidden><span id="bannertxt"></span></div>
  <div class="cols">
    <section aria-labelledby="in-h">
      <h2 id="in-h">Bevitel</h2>
      <form id="f" novalidate autocomplete="off">
        <div class="field"><label for="nev">Név</label><input id="nev" type="text"></div>
        <div class="field"><label for="uto">Utónév</label><input id="uto" type="text"></div>
        <div class="field"><label for="szul">Születési dátum</label><input id="szul" type="date"></div>
        <div class="field"><label for="lak">Lakhely</label><input id="lak" type="text"></div>
        <div class="field"><label for="fog">Foglalkozás</label><input id="fog" type="text"></div>
        <button id="kesz" type="submit" disabled>Kész</button>
        <p class="status" id="st" role="status"></p>
      </form>
    </section>
    <section aria-labelledby="out-h">
      <h2 id="out-h">Listázás</h2>
      <div class="actions">
        <button id="listaz" type="button">Listáz</button>
        <button id="torol" type="button" class="sec">Lista törlése</button>
      </div>
      <p class="status" id="st2" role="status"></p>
      <div class="win" id="win" hidden>
        <div class="bar"><span>Mentett adatok</span><span id="cnt"></span></div>
        <div class="body" id="body"></div>
      </div>
    </section>
  </div>
</div>

<!--
  ===== BEÁLLÍTÁS (egyszer kell elvégezni) =====
  1) https://console.firebase.google.com -> "Add project" -> ingyenes projekt létrehozása
  2) Bal menü -> Build -> Firestore Database -> "Create database" -> induljon "test mode"-ban
     (ez a próbaidő alatt nyitva engedi az olvasást/írást; utána lásd a szabályokat lent)
  3) Project settings (fogaskerék ikon) -> "Your apps" -> "</>" (Web app) -> add hozzá az appot
     -> a kapott firebaseConfig objektumot másold be ide a "IDE MÁSOLD A SAJÁT CONFIGOT" helyére
  4) Firestore -> Rules fül -> illeszd be ezt, majd Publish:
       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /adatok/{doc} {
             allow read, create: if true;
             allow update, delete: if false;
           }
         }
       }
     (ez engedi mindenkinek az olvasást és új rekord hozzáadását, de a módosítást/törlést nem
      -- a "Lista törlése" gombhoz cseréld "allow delete: if true;"-ra, ha azt is szeretnéd)
  5) Töltsd fel ezt a fájlt (és ha van, a háttérképet ugyanabba a mappába) egy ingyenes
     statikus tárhelyre: pl. Firebase Hosting (a saját projektedben, "firebase deploy"),
     vagy GitHub Pages, vagy Netlify -- bármelyik működik, nem kell hozzá saját szerver.
-->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

// ===== IDE MÁSOLD A SAJÁT CONFIGOT a Firebase konzolból (lásd fenti útmutató 3. pont) =====
const firebaseConfig = {
  apiKey: "AIza...",
  authDomain: "szemelyes-adatok-xxxx.firebaseapp.com",
  projectId: "szemelyes-adatok-xxxx",
  storageBucket: "szemelyes-adatok-xxxx.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
// ===========================================================================================

const banner = document.getElementById("banner"), bannerTxt = document.getElementById("bannertxt");
if(String(firebaseConfig.apiKey).includes("IDE_JÖN")){
  bannerTxt.textContent = "Az oldal még nincs összekötve az adatbázissal — illeszd be a saját Firebase-configodat a fájl végén.";
  banner.hidden = false;
}

let db = null;
try {
  db = getFirestore(initializeApp(firebaseConfig));
} catch(e){ /* hibás config esetén db marad null, lásd lent */ }

const col = () => collection(db, "adatok");
const ids = ["nev","uto","szul","lak","fog"];
const el = {}; ids.forEach(i => el[i] = document.getElementById(i));
const btn = document.getElementById("kesz"), st = document.getElementById("st"), st2 = document.getElementById("st2");
const dlg = document.getElementById("dup"), delDlg = document.getElementById("del");
const listazBtn = document.getElementById("listaz"), torolBtn = document.getElementById("torol");

try { el.szul.max = new Date().toISOString().slice(0,10); } catch(e){}

// Két rekord akkor egyforma, ha mind az öt mező azonos (szóköz és kis/nagybetű nem számít)
function keyOf(r){ return ids.map(k => String(r[k]).trim().toLowerCase()).join("|"); }
function allFilled(){ return ids.every(i => el[i].value.trim() !== ""); }
function refresh(){ btn.disabled = !db || !allFilled(); }
ids.forEach(i => el[i].addEventListener("input", () => { st.textContent = ""; refresh(); }));
refresh();

function fmtDate(iso){
  const p = iso.split("-");
  return p.length === 3 ? p[0] + ". " + p[1] + ". " + p[2] + "." : iso;
}
function winVisible(){ return !document.getElementById("win").hidden; }

function render(list){
  const sorted = list.slice().sort((a,b) => a.nev.localeCompare(b.nev,"hu") || a.uto.localeCompare(b.uto,"hu"));
  const win = document.getElementById("win"), body = document.getElementById("body");
  document.getElementById("cnt").textContent = sorted.length + " rekord";
  body.textContent = "";
  if(!sorted.length){
    const p = document.createElement("p");
    p.className = "empty"; p.textContent = "Nincs még bejegyzés";
    body.appendChild(p);
  } else {
    const t = document.createElement("table");
    const hr = t.createTHead().insertRow();
    ["Név","Utónév","Születési dátum","Lakhely","Foglalkozás"].forEach(h => {
      const th = document.createElement("th"); th.textContent = h; hr.appendChild(th);
    });
    const tb = t.createTBody();
    sorted.forEach(r => {
      const tr = tb.insertRow();
      [r.nev, r.uto, fmtDate(r.szul), r.lak, r.fog].forEach(v => tr.insertCell().textContent = v);
    });
    body.appendChild(t);
  }
  win.hidden = false;
}

async function fetchAll(){
  const snap = await getDocs(col());
  const out = [];
  snap.forEach(d => out.push({ id: d.id, ...d.data() }));
  return out;
}

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if(!allFilled() || !db) return;
  btn.disabled = true;
  try {
    const rec = { nev: el.nev.value.trim(), uto: el.uto.value.trim(), szul: el.szul.value,
                   lak: el.lak.value.trim(), fog: el.fog.value.trim() };
    const key = keyOf(rec);
    const list = await fetchAll();
    if(list.some(r => keyOf(r) === key)){
      st.textContent = "";
      if(dlg.showModal) dlg.showModal(); else alert("Ez a személy már a listában van");
      refresh(); return;
    }
    await addDoc(col(), { ...rec, key });
    ids.forEach(i => el[i].value = "");
    st.textContent = "Elmentve a közös listába.";
    if(winVisible()) render(await fetchAll());
    el.nev.focus();
  } catch(e){ st.textContent = "Hiba: " + (e.message || e); }
  refresh();
});

listazBtn.addEventListener("click", async () => {
  if(!db){ st2.textContent = "Az oldal nincs összekötve az adatbázissal."; return; }
  try { render(await fetchAll()); }
  catch(e){ st2.textContent = "Hiba a betöltéskor: " + (e.message || e); }
});

function confirmDelete(){
  return new Promise(res => {
    delDlg.returnValue = "";
    delDlg.addEventListener("close", function h(){
      delDlg.removeEventListener("close", h);
      res(delDlg.returnValue === "ok");
    });
    delDlg.showModal();
  });
}

torolBtn.addEventListener("click", async () => {
  if(!db){ st2.textContent = "Az oldal nincs összekötve az adatbázissal."; return; }
  try {
    const list = await fetchAll();
    if(!list.length){ st2.textContent = "Nincs lista"; if(winVisible()) render([]); return; }
    if(!(await confirmDelete())) return;
    const batch = writeBatch(db);
    list.forEach(r => batch.delete(doc(db, "adatok", r.id)));
    await batch.commit();
    st2.textContent = "A lista törölve.";
    if(winVisible()) render([]);
  } catch(e){ st2.textContent = "Hiba: " + (e.message || e); }
});

// Háttérkép: ha a fájl mellé feltöltöd (ugyanabba a mappába), automatikusan megjelenik;
// ha nincs ott, a beágyazott háttér marad.
(function(){
  const PHOTO = "vecteezy_magnifying-glass-revealing-a-dense-crowd-during-sunset_50116019.jpeg";
  const probe = new Image();
  probe.onload = () => {
    const ph = document.getElementById("photo");
    ph.style.backgroundImage = `linear-gradient(rgba(8,14,26,.38),rgba(8,14,26,.38)),url("${PHOTO}")`;
    ph.hidden = false;
    document.documentElement.classList.add("has-photo");
  };
  probe.src = PHOTO;
})();
</script>
</body>
</html>
